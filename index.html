<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#d4a843">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="工时记录">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="https://img.icons8.com/fluency/192/clock.png">
<title>工时记录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0a0c; --surface:#13131a; --surface-2:#1c1c26;
    --border:#2a2a3a; --accent:#d4a843; --accent-dim:#8b7230;
    --accent-glow:rgba(212,168,67,0.15);
    --text:#e8e4dc; --text-muted:#6b6878;
    --success:#4ecb71; --danger:#e05252;
    --info:#5b9ef0; --purple:#a87de8;
    --radius:12px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 15% 20%,rgba(212,168,67,0.04) 0%,transparent 50%),radial-gradient(ellipse at 85% 80%,rgba(100,60,180,0.03) 0%,transparent 50%);pointer-events:none;z-index:0}
  .app{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:40px 20px 100px}

  /* Header */
  .header{text-align:center;margin-bottom:48px;animation:fadeDown .6s ease}
  .header-icon{width:56px;height:56px;background:linear-gradient(135deg,var(--accent),#c49030);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:26px;box-shadow:0 8px 32px rgba(212,168,67,0.2)}
  .header h1{font-size:28px;font-weight:700;letter-spacing:-0.5px}
  .header p{color:var(--text-muted);font-size:14px;margin-top:6px}

  /* Install Banner */
  .install-banner{background:linear-gradient(135deg,rgba(212,168,67,0.08),rgba(168,125,232,0.06));border:1px dashed var(--accent-dim);border-radius:var(--radius);padding:16px 20px;margin-bottom:28px;display:flex;align-items:center;justify-content:space-between;gap:12px;animation:fadeUp .6s ease .1s both;flex-wrap:wrap}
  .install-banner .ib-text{font-size:13px;color:var(--text-muted);line-height:1.6}
  .install-banner .ib-text strong{color:var(--accent)}
  .install-btn{background:linear-gradient(135deg,var(--accent),#c49030);color:#0a0a0c;border:none;padding:10px 22px;border-radius:8px;font-family:'Noto Sans SC',sans-serif;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .2s}
  .install-btn:hover{box-shadow:0 4px 16px rgba(212,168,67,0.3)}
  .install-dismiss{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:18px;padding:4px 8px}
  .install-banner.hidden{display:none}

  /* Section Titles */
  .section-title{font-size:12px;font-weight:500;color:var(--text-muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px;padding-left:2px}

  /* Summary Cards */
  .summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;animation:fadeUp .6s ease .15s both}
  .summary-grid.total-row{margin-bottom:36px;animation-delay:.2s}
  .summary-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 12px;text-align:center;position:relative;overflow:hidden;transition:border-color .3s,transform .2s}
  .summary-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--card-accent,var(--accent));opacity:.5}
  .summary-card:hover{border-color:var(--accent-dim);transform:translateY(-2px)}
  .summary-card .label{font-size:11px;color:var(--text-muted);letter-spacing:.8px;margin-bottom:8px}
  .summary-card .value{font-family:'Space Mono',monospace;font-size:22px;font-weight:700;color:var(--card-accent,var(--accent))}
  .summary-card .unit{font-size:12px;color:var(--text-muted)}
  .accent-gold{--card-accent:var(--accent)}
  .accent-green{--card-accent:var(--success)}
  .accent-blue{--card-accent:var(--info)}
  .accent-red{--card-accent:var(--danger)}
  .accent-purple{--card-accent:var(--purple)}

  /* Type Tabs */
  .type-tabs{display:flex;gap:0;margin-bottom:20px;background:var(--bg);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .type-tab{flex:1;padding:12px 0;text-align:center;font-size:13px;font-weight:500;color:var(--text-muted);cursor:pointer;transition:all .2s;border-right:1px solid var(--border);user-select:none;position:relative}
  .type-tab:last-child{border-right:none}
  .type-tab:hover{color:var(--text);background:var(--surface-2)}
  .type-tab.active{color:var(--bg);font-weight:700}
  .type-tab.active[data-type="normal"]{background:var(--accent)}
  .type-tab.active[data-type="tiaoxiu"]{background:var(--purple)}
  .type-tab.active[data-type="zhuanban"]{background:var(--info)}
  .type-tab .tab-icon{margin-right:6px;font-size:15px}

  /* Form */
  .form-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-bottom:36px;animation:fadeUp .6s ease .2s both}
  .form-section h2{font-size:16px;font-weight:500;margin-bottom:20px;display:flex;align-items:center;gap:8px}
  .form-section h2::before{content:'';width:3px;height:16px;background:var(--accent);border-radius:2px}
  .form-section h2.type-tiaoxiu::before{background:var(--purple)}
  .form-section h2.type-zhuanban::before{background:var(--info)}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .form-row.three-col{grid-template-columns:1fr 1fr 1fr}
  .form-row.four-col{grid-template-columns:1fr 1fr 1fr 1fr}
  .form-group{display:flex;flex-direction:column;gap:6px}
  .form-group label{font-size:12px;color:var(--text-muted);letter-spacing:.5px}
  .form-group input{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--text);font-family:'Space Mono',monospace;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s;width:100%}
  .form-group input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  .form-group input[type="date"]::-webkit-calendar-picker-indicator,.form-group input[type="time"]::-webkit-calendar-picker-indicator{filter:invert(.7);cursor:pointer}
  .quick-tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .quick-tags label{font-size:12px;color:var(--text-muted);letter-spacing:.5px;margin-right:4px}
  .tag{background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);font-family:'Noto Sans SC',sans-serif;font-size:12px;padding:6px 14px;border-radius:20px;cursor:pointer;transition:all .2s;user-select:none}
  .tag:hover,.tag.active{border-color:var(--accent-dim);color:var(--accent);background:var(--accent-glow)}
  .form-actions{display:flex;gap:10px;margin-top:20px}
  .btn{padding:12px 24px;border:none;border-radius:8px;font-family:'Noto Sans SC',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;letter-spacing:.5px}
  .btn-primary{background:linear-gradient(135deg,var(--accent),#c49030);color:#0a0a0c;flex:1}
  .btn-primary:hover{box-shadow:0 4px 20px rgba(212,168,67,0.3);transform:translateY(-1px)}
  .btn-primary.purple{background:linear-gradient(135deg,var(--purple),#7c5bc4)}
  .btn-primary.blue{background:linear-gradient(135deg,var(--info),#3a7ab8)}
  .btn-secondary{background:var(--surface-2);color:var(--text-muted);border:1px solid var(--border)}
  .btn-secondary:hover{color:var(--text);border-color:var(--text-muted)}
  .hidden{display:none !important}
  .info-box{background:rgba(168,125,232,.06);border:1px solid rgba(168,125,232,.2);border-radius:8px;padding:14px 16px;margin-bottom:16px;font-size:12px;color:var(--text-muted);line-height:1.7}
  .info-box strong{color:var(--purple)}
  .info-box.info-blue{background:rgba(91,158,240,.06);border-color:rgba(91,158,240,.2)}
  .info-box.info-blue strong{color:var(--info)}

  /* Records */
  .records-section{animation:fadeUp .6s ease .3s both}
  .records-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .records-header h2{font-size:16px;font-weight:500;display:flex;align-items:center;gap:8px}
  .records-header h2::before{content:'';width:3px;height:16px;background:var(--accent);border-radius:2px}
  .btn-clear{background:none;border:none;color:var(--text-muted);font-size:12px;cursor:pointer;padding:6px 12px;border-radius:6px;font-family:'Noto Sans SC',sans-serif;transition:all .2s}
  .btn-clear:hover{color:var(--danger);background:rgba(224,82,82,.1)}
  .record-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:16px;transition:border-color .2s;animation:slideIn .35s ease;position:relative}
  .record-card::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 2px 2px 0}
  .record-card.type-normal::before{background:var(--accent)}
  .record-card.type-tiaoxiu::before{background:var(--purple)}
  .record-card.type-zhuanban::before{background:var(--info)}
  .record-card:hover{border-color:var(--accent-dim)}
  .record-date{font-size:15px;font-weight:500;margin-bottom:6px;padding-left:10px}
  .record-date .weekday{color:var(--text-muted);font-weight:400;font-size:13px;margin-left:8px}
  .record-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-left:10px}
  .record-time{font-family:'Space Mono',monospace;font-size:13px;color:var(--text-muted)}
  .record-time .arrow{margin:0 5px;color:var(--border)}
  .record-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--text-muted);background:var(--surface-2);padding:2px 8px;border-radius:4px;white-space:nowrap}
  .record-badge.deduct{color:var(--danger);background:rgba(224,82,82,.08)}
  .record-badge.note{color:var(--accent-dim);background:var(--accent-glow)}
  .record-badge.rest{color:var(--info);background:rgba(91,158,240,.08)}
  .record-badge.tiaoxiu-badge{color:var(--purple);background:rgba(168,125,232,.1);font-weight:500}
  .record-badge.zhuanban-badge{color:var(--info);background:rgba(91,158,240,.1);font-weight:500}
  .record-hours{text-align:center}
  .record-hours .hours-val{font-family:'Space Mono',monospace;font-size:18px;font-weight:700}
  .record-hours .hours-label{font-size:11px;color:var(--text-muted)}
  .record-earning{text-align:right;min-width:90px}
  .record-earning .earning-val{font-family:'Space Mono',monospace;font-size:18px;font-weight:700;color:var(--accent)}
  .record-earning .earning-label{font-size:11px;color:var(--text-muted)}
  .record-card-wrapper{position:relative}
  .btn-delete{position:absolute;top:50%;right:-36px;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:16px;opacity:0;transition:opacity .2s,color .2s;padding:4px}
  .record-card-wrapper:hover .btn-delete{opacity:1}
  .btn-delete:hover{color:var(--danger)}
  .records-footer{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 24px;margin-top:16px;display:grid;grid-template-columns:repeat(5,1fr);gap:12px;animation:fadeUp .3s ease}
  .footer-item{text-align:center}
  .footer-item .f-label{font-size:10px;color:var(--text-muted);letter-spacing:.5px;margin-bottom:4px}
  .footer-item .f-value{font-family:'Space Mono',monospace;font-size:15px;font-weight:700}
  .footer-item .f-value.gold{color:var(--accent)}
  .footer-item .f-value.green{color:var(--success)}
  .footer-item .f-value.blue{color:var(--info)}
  .footer-item .f-value.red{color:var(--danger)}
  .footer-item .f-value.purple{color:var(--purple)}
  .empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
  .empty-state .empty-icon{font-size:48px;margin-bottom:16px;opacity:.4}
  .empty-state p{font-size:14px}
  .filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .filter-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-muted);font-family:'Noto Sans SC',sans-serif;font-size:12px;padding:6px 14px;border-radius:20px;cursor:pointer;transition:all .2s}
  .filter-btn:hover,.filter-btn.active{border-color:var(--accent-dim);color:var(--accent);background:var(--accent-glow)}

  @keyframes fadeDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  @keyframes slideIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:12px 24px;border-radius:10px;font-size:14px;z-index:100;transition:transform .35s ease,opacity .35s;opacity:0;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}

  @media(max-width:600px){
    .app{padding:24px 16px 80px}
    .summary-grid,.summary-grid.total-row{grid-template-columns:1fr 1fr}
    .form-row,.form-row.three-col,.form-row.four-col{grid-template-columns:1fr}
    .type-tab .tab-text{display:none}
    .record-card{grid-template-columns:1fr;gap:12px}
    .record-hours{text-align:left;display:flex;align-items:baseline;gap:6px}
    .record-earning{text-align:left;border-top:1px solid var(--border);padding-top:12px}
    .btn-delete{right:-8px;top:14px;opacity:1}
    .records-footer{grid-template-columns:1fr 1fr}
    .install-banner{flex-direction:column;text-align:center}
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-icon">&#9201;</div>
    <h1>工时记录</h1>
    <p>记录每一天的付出，看见每一分的价值</p>
  </div>

  <!-- Install Banner -->
  <div class="install-banner" id="installBanner" style="display:none">
    <div class="ib-text"><strong>安装到手机</strong> — 添加到桌面即可像 APP 一样使用，支持离线</div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="install-btn" id="installBtn" onclick="installPWA()">安装</button>
      <button class="install-dismiss" onclick="dismissInstall()">&#10005;</button>
    </div>
  </div>

  <div class="section-title">本月概览</div>
  <div class="summary-grid">
    <div class="summary-card accent-gold"><div class="label">本月工时</div><div class="value" id="totalHours">0.0</div><div class="unit">小时</div></div>
    <div class="summary-card accent-purple"><div class="label">调休/转班</div><div class="value" id="totalSpecial">0</div><div class="unit">天</div></div>
    <div class="summary-card accent-blue"><div class="label">打卡天数</div><div class="value" id="totalDays">0</div><div class="unit">天</div></div>
  </div>
  <div class="section-title">累计总和</div>
  <div class="summary-grid total-row">
    <div class="summary-card accent-gold"><div class="label">累计工时</div><div class="value" id="allHours">0.0</div><div class="unit">小时</div></div>
    <div class="summary-card accent-green"><div class="label">收入总和</div><div class="value" id="allEarning">0</div><div class="unit">元</div></div>
    <div class="summary-card accent-blue"><div class="label">累计天数</div><div class="value" id="allDays">0</div><div class="unit">天</div></div>
  </div>

  <div class="form-section">
    <h2 id="formTitle">新增打卡</h2>
    <div class="type-tabs">
      <div class="type-tab active" data-type="normal" onclick="switchType('normal')"><span class="tab-icon">&#9201;</span><span class="tab-text">正常打卡</span></div>
      <div class="type-tab" data-type="tiaoxiu" onclick="switchType('tiaoxiu')"><span class="tab-icon">&#127881;</span><span class="tab-text">调休</span></div>
      <div class="type-tab" data-type="zhuanban" onclick="switchType('zhuanban')"><span class="tab-icon">&#128260;</span><span class="tab-text">转班</span></div>
    </div>

    <div id="formNormal">
      <div class="form-row three-col">
        <div class="form-group"><label>日期</label><input type="date" id="inputDate"></div>
        <div class="form-group"><label>上班时间</label><input type="time" id="inputStart" value="09:00"></div>
        <div class="form-group"><label>下班时间</label><input type="time" id="inputEnd" value="18:00"></div>
      </div>
      <div class="quick-tags" style="margin-bottom:16px">
        <label>班次</label>
        <span class="tag" onclick="setQuickTime('09:00','18:00')">标准 9-18</span>
        <span class="tag" onclick="setQuickTime('08:00','17:00')">早班 8-17</span>
        <span class="tag" onclick="setQuickTime('10:00','19:00')">晚班 10-19</span>
        <span class="tag" onclick="setQuickTime('09:00','21:00')">加班 9-21</span>
      </div>
      <div class="form-row four-col">
        <div class="form-group"><label>用餐休息（分钟）</label><input type="number" id="inputBreak" value="60" min="0" step="15"></div>
        <div class="form-group"><label>时薪（元/小时）</label><input type="number" id="inputRate" placeholder="例: 50" min="0" step="0.5"></div>
        <div class="form-group"><label>备注（可选）</label><input type="text" id="inputNote" placeholder="例: 正常班"></div>
        <div class="form-group" style="justify-content:flex-end">
          <div class="quick-tags" style="margin:0;gap:6px">
            <span class="tag break-tag" onclick="setBreak(0)">无休</span>
            <span class="tag break-tag" onclick="setBreak(30)">30分</span>
            <span class="tag break-tag active" onclick="setBreak(60)">1小时</span>
            <span class="tag break-tag" onclick="setBreak(90)">1.5时</span>
            <span class="tag break-tag" onclick="setBreak(120)">2小时</span>
          </div>
        </div>
      </div>
    </div>

    <div id="formTiaoxiu" class="hidden">
      <div class="info-box"><strong>调休</strong>：因加班、节假日值班等获得的补偿休息日。记录调休可帮助你跟踪剩余调休余额。</div>
      <div class="form-row three-col">
        <div class="form-group"><label>调休日期</label><input type="date" id="txDate"></div>
        <div class="form-group"><label>调休时长（小时）</label><input type="number" id="txHours" value="8" min="0.5" step="0.5"></div>
        <div class="form-group"><label>来源/原因</label><input type="text" id="txReason" placeholder="例: 上周六加班调休"></div>
      </div>
    </div>

    <div id="formZhuanban" class="hidden">
      <div class="info-box info-blue"><strong>转班</strong>：将正常工作日的班次调整到其他日期。转班照常计算工时和收入。</div>
      <div class="form-row three-col">
        <div class="form-group"><label>转班日期</label><input type="date" id="zbDate"></div>
        <div class="form-group"><label>上班时间</label><input type="time" id="zbStart" value="09:00"></div>
        <div class="form-group"><label>下班时间</label><input type="time" id="zbEnd" value="18:00"></div>
      </div>
      <div class="form-row four-col">
        <div class="form-group"><label>用餐休息（分钟）</label><input type="number" id="zbBreak" value="60" min="0" step="15"></div>
        <div class="form-group"><label>时薪（元/小时）</label><input type="number" id="zbRate" placeholder="例: 50" min="0" step="0.5"></div>
        <div class="form-group"><label>原应休日期</label><input type="date" id="zbOrigDate"></div>
        <div class="form-group"><label>备注</label><input type="text" id="zbNote" placeholder="例: 周六转班"></div>
      </div>
    </div>

    <div class="form-actions">
      <button class="btn btn-primary" id="btnSubmit" onclick="addRecord()">记录打卡</button>
      <button class="btn btn-secondary" onclick="fillNow()">填充当前时间</button>
    </div>
  </div>

  <div class="records-section">
    <div class="records-header">
      <h2>打卡记录</h2>
      <button class="btn-clear" onclick="clearAll()">清空全部</button>
    </div>
    <div class="filter-bar" id="filterBar"></div>
    <div id="recordsList"></div>
    <div id="recordsFooter"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  // === PWA Install ===
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    if (!localStorage.getItem('installDismissed')) {
      document.getElementById('installBanner').style.display = 'flex';
    }
  });
  function installPWA() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(r => {
        if (r.outcome === 'accepted') showToast('安装成功！');
        deferredPrompt = null;
        document.getElementById('installBanner').style.display = 'none';
      });
    } else {
      showToast('请使用浏览器菜单 → "添加到主屏幕"');
    }
  }
  function dismissInstall() {
    document.getElementById('installBanner').style.display = 'none';
    localStorage.setItem('installDismissed', '1');
  }
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  // === App Logic ===
  const WEEKDAYS = ['周日','周一','周二','周三','周四','周五','周六'];
  let records = JSON.parse(localStorage.getItem('workRecordsV3') || '[]');
  let currentFilter = 'all';
  let currentType = 'normal';
  records = records.map(r => ({ ...r, type: r.type || 'normal', breakMin: r.breakMin !== undefined ? r.breakMin : 60 }));

  document.getElementById('inputDate').valueAsDate = new Date();
  document.getElementById('txDate').valueAsDate = new Date();
  document.getElementById('zbDate').valueAsDate = new Date();
  const savedRate = localStorage.getItem('workRate');
  if (savedRate) { document.getElementById('inputRate').value = savedRate; document.getElementById('zbRate').value = savedRate; }

  function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }
  function switchType(type) {
    currentType = type;
    document.querySelectorAll('.type-tab').forEach(el => el.classList.remove('active'));
    document.querySelector(`.type-tab[data-type="${type}"]`).classList.add('active');
    document.getElementById('formNormal').classList.toggle('hidden', type !== 'normal');
    document.getElementById('formTiaoxiu').classList.toggle('hidden', type !== 'tiaoxiu');
    document.getElementById('formZhuanban').classList.toggle('hidden', type !== 'zhuanban');
    const title = document.getElementById('formTitle');
    title.className = '';
    if (type === 'normal') { title.textContent = '新增打卡'; }
    if (type === 'tiaoxiu') { title.textContent = '记录调休'; title.classList.add('type-tiaoxiu'); }
    if (type === 'zhuanban') { title.textContent = '记录转班'; title.classList.add('type-zhuanban'); }
    const btn = document.getElementById('btnSubmit');
    btn.className = 'btn btn-primary';
    if (type === 'tiaoxiu') { btn.classList.add('purple'); btn.textContent = '记录调休'; }
    else if (type === 'zhuanban') { btn.classList.add('blue'); btn.textContent = '记录转班'; }
    else { btn.textContent = '记录打卡'; }
  }
  function setQuickTime(s, e) { document.getElementById('inputStart').value = s; document.getElementById('inputEnd').value = e; }
  function setBreak(min) {
    document.getElementById('inputBreak').value = min;
    const map = {'无休':0,'30分':30,'1小时':60,'1.5时':90,'2小时':120};
    document.querySelectorAll('.break-tag').forEach(el => { el.classList.toggle('active', map[el.textContent] === min); });
  }
  function fillNow() {
    const now = new Date();
    const hm = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    if (currentType === 'normal') { document.getElementById('inputEnd').value = hm; document.getElementById('inputDate').valueAsDate = now; }
    else if (currentType === 'zhuanban') { document.getElementById('zbEnd').value = hm; document.getElementById('zbDate').valueAsDate = now; }
    else { document.getElementById('txDate').valueAsDate = now; }
    showToast('已填充当前时间');
  }
  function calcRawMinutes(s, e) { const [sh,sm]=s.split(':').map(Number);const [eh,em]=e.split(':').map(Number);let m=(eh*60+em)-(sh*60+sm);if(m<0)m+=1440;return m; }
  function formatBreak(min) { if(min===0)return'无休息';if(min<60)return min+'分钟';const h=Math.floor(min/60),m=min%60;return m?h+'小时'+m+'分':h+'小时'; }

  function addRecord() {
    let rec;
    if (currentType === 'normal') {
      const date=document.getElementById('inputDate').value,start=document.getElementById('inputStart').value,end=document.getElementById('inputEnd').value;
      const breakMin=parseInt(document.getElementById('inputBreak').value)||0,rate=parseFloat(document.getElementById('inputRate').value),note=document.getElementById('inputNote').value.trim();
      if(!date)return showToast('请选择日期');if(!start||!end)return showToast('请填写上下班时间');if(!rate||rate<=0)return showToast('请填写时薪');
      localStorage.setItem('workRate',rate);
      const rawMins=calcRawMinutes(start,end);if(breakMin>=rawMins)return showToast('休息时间不能超过总工时');
      const workMins=rawMins-breakMin,hours=Math.round(workMins/60*100)/100,earning=Math.round(hours*rate*100)/100;
      rec={id:Date.now(),type:'normal',date,start,end,breakMin,rawMins,workMins,hours,rate,earning,note};
      showToast(`实际 ${hours}h，收入 ¥${earning.toFixed(2)}`);
      document.getElementById('inputNote').value='';
    } else if (currentType === 'tiaoxiu') {
      const date=document.getElementById('txDate').value,hours=parseFloat(document.getElementById('txHours').value),reason=document.getElementById('txReason').value.trim();
      if(!date)return showToast('请选择日期');if(!hours||hours<=0)return showToast('请填写时长');
      rec={id:Date.now(),type:'tiaoxiu',date,hours,reason,start:'',end:'',breakMin:0,rawMins:0,workMins:0,rate:0,earning:0,note:''};
      showToast(`调休 ${hours} 小时`);document.getElementById('txReason').value='';
    } else {
      const date=document.getElementById('zbDate').value,start=document.getElementById('zbStart').value,end=document.getElementById('zbEnd').value;
      const breakMin=parseInt(document.getElementById('zbBreak').value)||0,rate=parseFloat(document.getElementById('zbRate').value);
      const origDate=document.getElementById('zbOrigDate').value,note=document.getElementById('zbNote').value.trim();
      if(!date)return showToast('请选择日期');if(!start||!end)return showToast('请填写时间');if(!rate||rate<=0)return showToast('请填写时薪');
      localStorage.setItem('workRate',rate);
      const rawMins=calcRawMinutes(start,end);if(breakMin>=rawMins)return showToast('休息时间不能超过总工时');
      const workMins=rawMins-breakMin,hours=Math.round(workMins/60*100)/100,earning=Math.round(hours*rate*100)/100;
      rec={id:Date.now(),type:'zhuanban',date,start,end,breakMin,rawMins,workMins,hours,rate,earning,origDate:origDate||'',note};
      showToast(`转班 ${hours}h，收入 ¥${earning.toFixed(2)}`);document.getElementById('zbNote').value='';document.getElementById('zbOrigDate').value='';
    }
    records.push(rec);records.sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);save();render();
  }
  function deleteRecord(id) { records=records.filter(r=>r.id!==id);save();render();showToast('已删除'); }
  function clearAll() { if(!records.length)return;if(!confirm('确定清空所有记录？'))return;records=[];save();render();showToast('已清空'); }
  function save() { localStorage.setItem('workRecordsV3',JSON.stringify(records)); }
  function getMonths() { const s=new Set();records.forEach(r=>s.add(r.date.substring(0,7)));return[...s].sort().reverse(); }

  function renderFilters() {
    const bar=document.getElementById('filterBar'),months=getMonths();
    let html=`<button class="filter-btn ${currentFilter==='all'?'active':''}" onclick="setFilter('all')">全部</button>`;
    months.forEach(m=>{const[y,mo]=m.split('-');html+=`<button class="filter-btn ${currentFilter===m?'active':''}" onclick="setFilter('${m}')">${y}年${parseInt(mo)}月</button>`;});
    bar.innerHTML=html;
  }
  function setFilter(f){currentFilter=f;render();}

  function render() {
    renderFilters();
    const filtered=currentFilter==='all'?records:records.filter(r=>r.date.startsWith(currentFilter));
    const list=document.getElementById('recordsList');
    if(!filtered.length){list.innerHTML=`<div class="empty-state"><div class="empty-icon">&#128203;</div><p>还没有记录</p></div>`;}
    else{list.innerHTML=filtered.map((r,i)=>{
      const d=new Date(r.date+'T00:00:00'),weekday=WEEKDAYS[d.getDay()],dateStr=r.date.replace(/-/g,' / ');
      if(r.type==='tiaoxiu'){
        const reason=r.reason?`<span class="record-badge tiaoxiu-badge">${r.reason}</span>`:'';
        return`<div class="record-card-wrapper"><div class="record-card type-tiaoxiu" style="animation-delay:${i*.05}s"><div><div class="record-date">${dateStr}<span class="weekday">${weekday}</span></div><div class="record-meta"><span class="record-badge tiaoxiu-badge">调休</span><span class="record-badge">${r.hours} 小时</span>${reason}</div></div><div class="record-hours"><div class="hours-val" style="color:var(--purple)">${r.hours}</div><div class="hours-label">调休小时</div></div><div class="record-earning"><div class="earning-val" style="color:var(--text-muted)">—</div><div class="earning-label">休息日</div></div></div><button class="btn-delete" onclick="deleteRecord(${r.id})">&#10005;</button></div>`;
      }
      const rawH=(r.rawMins/60).toFixed(1),breakBadge=r.breakMin>0?`<span class="record-badge deduct">-${formatBreak(r.breakMin)}</span>`:`<span class="record-badge rest">无休息</span>`;
      const noteBadge=r.note?`<span class="record-badge note">${r.note}</span>`:'',origBadge=r.origDate?`<span class="record-badge" style="color:var(--info)">原休 ${r.origDate.replace(/-/g,'/')}</span>`:'';
      const typeClass=r.type==='zhuanban'?'type-zhuanban':'type-normal';
      const typeLabel=r.type==='zhuanban'?'<span class="record-badge zhuanban-badge">转班</span>':'';
      return`<div class="record-card-wrapper"><div class="record-card ${typeClass}" style="animation-delay:${i*.05}s"><div><div class="record-date">${dateStr}<span class="weekday">${weekday}</span></div><div class="record-meta">${typeLabel}<span class="record-time">${r.start} <span class="arrow">→</span> ${r.end}</span><span class="record-badge">${rawH}h 总时</span>${breakBadge}<span class="record-badge">¥${r.rate}/h</span>${origBadge}${noteBadge}</div></div><div class="record-hours"><div class="hours-val">${r.hours.toFixed(1)}</div><div class="hours-label">实际小时</div></div><div class="record-earning"><div class="earning-val">¥${r.earning.toFixed(2)}</div><div class="earning-label">收入</div></div></div><button class="btn-delete" onclick="deleteRecord(${r.id})">&#10005;</button></div>`;
    }).join('');}

    // Footer
    const footer=document.getElementById('recordsFooter');
    if(filtered.length){
      const workRecs=filtered.filter(r=>r.type!=='tiaoxiu'),txRecs=filtered.filter(r=>r.type==='tiaoxiu'),zbRecs=filtered.filter(r=>r.type==='zhuanban');
      const fHours=workRecs.reduce((s,r)=>s+r.hours,0),fEarning=workRecs.reduce((s,r)=>s+r.earning,0),fBreak=workRecs.reduce((s,r)=>s+(r.breakMin||0),0),fTxHours=txRecs.reduce((s,r)=>s+r.hours,0);
      const label=currentFilter==='all'?'全部':currentFilter.replace('-','年')+'月';
      footer.innerHTML=`<div class="footer-item"><div class="f-label">${label} · 工时</div><div class="f-value gold">${fHours.toFixed(1)}h</div></div><div class="footer-item"><div class="f-label">${label} · 收入</div><div class="f-value green">¥${fEarning.toFixed(0)}</div></div><div class="footer-item"><div class="f-label">${label} · 休息</div><div class="f-value red">${formatBreak(fBreak)}</div></div><div class="footer-item"><div class="f-label">${label} · 调休</div><div class="f-value purple">${fTxHours.toFixed(1)}h</div></div><div class="footer-item"><div class="f-label">${label} · 转班</div><div class="f-value blue">${zbRecs.length}天</div></div>`;
    }else{footer.innerHTML='';}

    // Top Summary
    const now=new Date(),thisMonth=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
    const mR=records.filter(r=>r.date.startsWith(thisMonth)),mW=mR.filter(r=>r.type!=='tiaoxiu'),mS=mR.filter(r=>r.type==='tiaoxiu'||r.type==='zhuanban');
    document.getElementById('totalHours').textContent=mW.reduce((s,r)=>s+r.hours,0).toFixed(1);
    document.getElementById('totalSpecial').textContent=mS.length;
    document.getElementById('totalDays').textContent=mR.length;
    document.getElementById('allHours').textContent=records.filter(r=>r.type!=='tiaoxiu').reduce((s,r)=>s+r.hours,0).toFixed(1);
    document.getElementById('allEarning').textContent=records.filter(r=>r.type!=='tiaoxiu').reduce((s,r)=>s+r.earning,0).toFixed(0);
    document.getElementById('allDays').textContent=records.length;
  }

  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.ctrlKey)addRecord();});
  render();
</script>
</body>
</html>
